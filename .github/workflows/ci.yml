name: Проверки репозитория

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Проверка структуры
        shell: bash
        run: |
          set -euo pipefail
          test -f build.sh
          test -d src
          test -d packaging/freebsd

      - name: Проверка JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('src').rglob('*.json'):
              with path.open('r', encoding='utf-8') as fh:
                  json.load(fh)
              print(f'OK {path}')
          PY

      - name: Проверка shell-скриптов
        shell: bash
        run: |
          set -euo pipefail
          sh -n build.sh
          while IFS= read -r -d '' file; do
            sh -n "$file"
            echo "OK $file"
          done < <(find src packaging -type f \( -name '*.sh' -o -path '*/rc.d/*' -o -name '+POST_INSTALL' -o -name '+PRE_DEINSTALL' -o -name '+POST_DEINSTALL' \) -print0)
